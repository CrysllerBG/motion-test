<!doctype html>
<html><head><meta charset="utf-8"><title>Render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// A bare canvas for frame-exact rendering by tools/render-frames.mjs (and later, export checks).
// ?c=<composition>&w=<px>  → window.studio.seek(t) paints the frame for time t.
import { compile } from './engine/timeline.js';
import { paintFrame } from './engine/render.js';
import { loadFonts } from './engine/fonts.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
window.studio = {
  ready: (async () => {
    const spec = await (await fetch('/api/compositions/' + encodeURIComponent(q.get('c')))).json();
    const comp = compile(spec);
    if (comp.errors.length) throw new Error(comp.errors.join('\n'));
    const W = Number(q.get('w')) || comp.width, H = Math.round(W * comp.height / comp.width);
    canvas.width = W; canvas.height = H;
    await loadFonts(spec.fonts);
    window.studio.seek = t => paintFrame(ctx, comp, t, W, H);
    window.studio.comp = comp;
    return { W, H, duration: comp.duration };
  })()
};
</script></body></html>
