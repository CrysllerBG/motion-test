<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Studio</title>
<link rel="stylesheet" href="editor/style.css">
</head>
<body>
<header class="top">
  <strong class="brand">Motion Studio</strong>
  <label class="picker"><span>Composition</span>
    <select id="compSelect" aria-label="Composition"></select>
  </label>
  <button class="btn small" id="newBtn" title="Start a new, empty composition">New</button>
  <span class="sep"></span>
  <button class="btn small" id="undoBtn" title="Undo (Ctrl/Cmd+Z)">Undo</button>
  <button class="btn small" id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
  <button class="btn small primary" id="saveBtn" title="Save to compositions/…json (Ctrl/Cmd+S)">Save</button>
  <button class="btn small" id="exportBtn" title="Render an MP4 video">Export video</button>
  <span class="status" id="status" role="status"></span>
</header>

<main class="workspace">
  <aside class="panel layers" aria-label="Layers">
    <h2 class="panel-title">Layers</h2>
    <div id="layers"></div>
  </aside>

  <section class="stage-col">
    <div class="stage-box" id="stageBox">
      <div class="stage-frame">
        <canvas id="stage"></canvas>
        <canvas id="overlay" aria-hidden="true"></canvas>
      </div>
    </div>
    <div class="errors" id="errors" hidden></div>
    <div class="controls">
      <button class="btn" id="playBtn" title="Play / pause (Space)">Play</button>
      <button class="btn" id="replayBtn" title="From the start (Home)">Replay</button>
      <button class="btn icon" id="prevFrame" title="Previous frame (←)" aria-label="Previous frame">‹</button>
      <button class="btn icon" id="nextFrame" title="Next frame (→)" aria-label="Next frame">›</button>
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Scrub through the composition">
      <span class="readout" id="readout">0.00 s</span>
      <label class="loop"><input type="checkbox" id="loop"> Loop</label>
      <button class="btn sound" id="soundBtn" aria-pressed="false" title="Browsers only play sound after a click">Sound off</button>
    </div>
  </section>

  <aside class="panel inspector" aria-label="Inspector">
    <h2 class="panel-title">Inspector</h2>
    <div id="inspector"></div>
  </aside>
</main>

<section class="timeline" aria-label="Timeline">
  <div class="tl-head"><h2>Timeline</h2><code>drag a bar to move it · drag its edges to retime · click empty space to scrub</code></div>
  <div id="timeline"></div>
</section>

<dialog id="exportDialog"></dialog>

<script src="vendor/tone-14.8.49.js"></script>
<script type="module" src="editor/main.js"></script>
</body>
</html>
